[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conclave-ml"
version = "0.1.0"
description = "Agentic AI framework with a machine-learning ensemble, not an LLM, as the cognitive core"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Aranya Mahmud"}]
keywords = ["agentic-ai", "ensemble-learning", "edge-ai", "offline", "disaster-response"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "joblib>=1.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.0", "xgboost>=2.0"]
experiments = ["pandas>=1.5", "pyarrow>=12", "matplotlib>=3.6"]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["conclave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
